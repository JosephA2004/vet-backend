<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veterinaria: Huellas del Monte - Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-dark navbar-vet px-3">
    <span class="navbar-brand mb-0 h1">🐾 Veterinaria: Huellas del Monte</span>
    <div class="d-flex align-items-center text-white">
      <span id="nombre-usuario" class="me-3"></span>
      <button id="btn-logout" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
    </div>
  </nav>

  <div class="container mt-4">
    <ul class="nav nav-pills mb-4" id="tabs">
      <li class="nav-item"><button class="nav-link active" data-tab="clientes">Clientes</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="mascotas">Mascotas</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="citas">Citas</button></li>
    </ul>
    <div id="contenido">
      <p class="text-muted">Cargando...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/clientes.js"></script>
  <script src="js/mascotas.js"></script>
  <script src="js/citas.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
