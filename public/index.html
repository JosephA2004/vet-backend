<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veterinaria: Huellas del Monte - Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body d-flex align-items-center justify-content-center">
  <div class="card shadow login-card">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="fs-1">🐾</div>
        <h3 class="fw-bold">Veterinaria: Huellas del Monte</h3>
        <p class="text-muted">Inicia sesión para continuar</p>
      </div>
      <form id="form-login">
        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <div id="error-msg" class="alert alert-danger d-none" role="alert"></div>
        <button type="submit" class="btn btn-success w-100">Ingresar</button>
      </form>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
